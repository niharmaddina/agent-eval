name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev,anthropic,openai]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy agent_eval
      - name: Pytest (offline)
        run: pytest
      - name: Committed baselines reproduce byte-for-byte
        # Regenerate both replay baselines with the timestamp pinned to the committed one;
        # any drift in the harness, suite or report format shows up as a git diff.
        run: |
          export SOURCE_DATE_EPOCH="$(python -c 'import json,datetime as dt; t=json.load(open("results/scripted/results.json"))["meta"]["generated_at"]; print(int(dt.datetime.strptime(t,"%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=dt.UTC).timestamp()))')"
          agent-eval run --provider scripted        --suite agent_eval/tasks/basic.yaml --out results/scripted/
          agent-eval run --provider scripted_flawed --suite agent_eval/tasks/basic.yaml --out results/scripted_flawed/
          git diff --exit-code --stat -- results/

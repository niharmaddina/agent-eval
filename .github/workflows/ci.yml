name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy agent_eval
      - name: Pytest (offline)
        run: pytest
      - name: Scripted baseline smoke run
        run: agent-eval run --provider scripted --suite agent_eval/tasks/basic.yaml --out /tmp/ae-ci

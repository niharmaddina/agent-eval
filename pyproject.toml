[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval"
version = "0.2.0"
description = "Offline-first harness for evaluating tool-calling LLM agents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nihar Maddina" }]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
openai = ["openai>=1.0"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
agent-eval = "agent_eval.cli:main"

[tool.setuptools.packages.find]
include = ["agent_eval*"]

[tool.setuptools.package-data]
agent_eval = ["tasks/*.yaml", "tools/fixtures/*.json", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
